# Wygenerowano z bazowa.toml przez generuj_pilotaz.py – nie edytuj ręcznie.
# Źródło plików P1–P3 (generuj_pilotaz.py) – zmieniamy tutaj, nie w pilotaz/.
# Komentarze NAD kluczem: generator podmienia całe linie z kluczami.
# Jednostka zasobów: metabolizm m = 1, więc E0, s, x, c_k to „kroki życia”.

[przebieg]
# W P1–P3 nadpisuje generator.
ziarno = 201
# W P1–P3 nadpisuje generator.
pokolenia = 50
kroki = 300

[plansza]
# Przy N = 200 gęstość ok. 5% – tyle wynosi szansa na sąsiada przed agentem.
H = 64
W = 64

[populacja]
N = 200

[zasoby]
# Każde pole starcza na 1–5 kroków życia.
c_min = 1.0
c_max = 5.0
# α = m: agent zbierający z jednego pola wychodzi na zero. W P2 nadpisuje generator.
alfa = 1.0

[obserwacje]
# Domyślnie c_max. Wejście „własne zasoby” (E0 / skala = 10) może dominować
# wyjścia – do sprawdzenia w kalibracji.
skala = 5.0

[koszty]
m = 1.0
# Koszt także przy nieudanej próbie.
ruch = 0.0
# Małe względem E0: dylemat wymaga zasobów ≥ s, a dylematów jest mało.
s = 2.0
# D5: p·x − c_k = 0,5·5 − 1 = 1,5 > 0 – kradzież opłacalna w oczekiwaniu.
c_k = 1.0
p = 0.5
x = 5.0

[siec]
# Strategie mieszane; M jako oszacowanie skłonności.
tryb = "softmax"
tau = 1.0
# Neurony warstwy ukrytej (tanh, D2, #24). 0 = sieć liniowa z Lab02 (L = 48);
# h = 8 → L = 120. Wartość referencyjną wybiera kalibracja.
h = 0

[ewolucja]
# Rodzic kończy pokolenie z co najmniej pulą startową; do kalibracji.
T = 50.0
# Z próby przeżycia (proba_przezycia.py): przy E0 = 100 nikt nie osiągał T.
E0 = 50.0
# 1/L – średnio jedna zmutowana waga na potomka.
r = "auto"
sigma = 0.2
# Wagi startowe z N(0, 1) – przycięcie prawie ich nie rusza.
w_max = 4.0
# Potomkowie blisko rodzica – sąsiedzi często spokrewnieni (D12).
R = 2

[zapis]
# W P1–P3 nadpisuje generator.
katalog = "wyniki/P2_posrednia_z201"
